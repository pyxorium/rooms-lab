<!doctype html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Live Pong</title>
<link rel="stylesheet" href="./pong.css">
</head>
<body>
<header>
  <span id="dot" aria-hidden="true"></span>
  <p id="status" role="status"></p>
  <span class="grow"></span>
  <button type="button" id="pauseBtn" hidden>Pause</button>
  <button type="button" id="gaugeBtn" class="icon" aria-expanded="false" aria-controls="gauge" title="Speed readout"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M4 16a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M12 16l4.5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16" r="1.8" fill="currentColor"/></svg><span class="sr">Speed readout</span></button>
  <button type="button" id="gearBtn" class="icon" aria-expanded="false" aria-controls="gear" title="Settings"><span aria-hidden="true">⚙</span><span class="sr">Settings</span></button>
</header>
<div id="stage">
  <canvas id="court" tabindex="0" aria-label="The court. Use the arrow keys (or W and S) to move your paddle; on a touch screen, drag."></canvas>
  <div id="scan" aria-hidden="true"></div>
  <div id="vig" aria-hidden="true"></div>
  <section id="gauge" class="panel" hidden aria-label="Speed readout"></section>
  <section id="gear" class="panel" hidden aria-label="Settings"></section>
</div>
<footer>
  <p id="line" role="status"></p>
  <div id="actions"></div>
  <p id="notice" role="status"></p>
</footer>
<script type="module" src="./pong.js"></script>
</body>
</html>
